#:schema https://schemas.spinframework.dev/spin/manifest-v2/latest.json

spin_manifest_version = 2

[application]
name = "quicknotes-time"
version = "0.1.0"
authors = ["Renata Salikhzyanova <reny.zel@mail.ru>"]
description = ""

[[trigger.http]]
route = "/time"
component = "quicknotes-time"

[component.quicknotes-time]
source = "main.wasm"
allowed_outbound_hosts = []
[component.quicknotes-time.build]
command = "go tool componentize-go build"
watch = ["**/*.go", "go.mod"]
